<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WebSocket Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; }
        #messages { border: 1px solid #ddd; border-radius: 8px; min-height: 250px; padding: 12px; margin-bottom: 16px; overflow-y: auto; }
        .message { margin: 8px 0; }
        .sender { font-weight: bold; }
        form { display: flex; gap: 10px; }
        input[type=text] { flex: 1; padding: 10px; }
        button { padding: 10px 18px; cursor: pointer; }
    </style>
</head>
<body>
<h1>Simple WebSocket Chat</h1>
<div id="messages"></div>
<form id="chatForm">
    <input id="sender" type="text" placeholder="Your name" value="Guest" />
    <input id="message" type="text" placeholder="Type a message" />
    <button type="submit">Send</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.4/lib/stomp.min.js"></script>
<script>
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chatForm');

    stompClient.connect({}, function () {
        stompClient.subscribe('/topic/messages', function (message) {
            const data = JSON.parse(message.body);
            const item = document.createElement('div');
            item.className = 'message';
            item.innerHTML = '<span class="sender">' + data.sender + ':</span> ' + data.content;
            messagesEl.appendChild(item);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        });
    });

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        const sender = document.getElementById('sender').value.trim() || 'Guest';
        const content = document.getElementById('message').value.trim();
        if (!content) return;

        stompClient.send('/app/chat.send', {}, JSON.stringify({ sender, content }));
        document.getElementById('message').value = '';
    });
</script>
</body>
</html>
